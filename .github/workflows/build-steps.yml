name: Building Helium APK

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runs-on:
        required: true
        type: string

permissions:
  contents: read

env:
  ARCH: ${{ inputs.arch }}

jobs:
  prep:
    name: Prepare resources
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with: { submodules: true }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          tags: helium-android-builder:trixie-slim
          outputs: type=docker,dest=/tmp/helium-android-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp/helium-android-builder.tar
          retention-days: 1

      - name: Prepare build tree
        uses: ./.github/actions/build
        with:
          arch: ${{ inputs.arch }}
          prepare-only: true

  build_part_01:
    runs-on: ${{ inputs.runs-on }}
    needs: prep
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_02:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_01.outputs.status == 'running'
    needs: build_part_01
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_03:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_02.outputs.status == 'running'
    needs: build_part_02
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_04:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_03.outputs.status == 'running'
    needs: build_part_03
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_05:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_04.outputs.status == 'running'
    needs: build_part_04
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_06:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_05.outputs.status == 'running'
    needs: build_part_05
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_07:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_06.outputs.status == 'running'
    needs: build_part_06
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_08:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_07.outputs.status == 'running'
    needs: build_part_07
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_09:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_08.outputs.status == 'running'
    needs: build_part_08
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          arch: ${{ inputs.arch }}

  build_part_10:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_09.outputs.status == 'running'
    needs: build_part_09
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        with:
          arch: ${{ inputs.arch }}
          final: true

  package:
    name: Package APK
    runs-on: ${{ inputs.runs-on }}
    if: ${{ !cancelled() && !failure()
            && contains(fromJSON('["success", "skipped"]'),
                        needs.build_part_10.result) }}
    needs: build_part_10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }

      - name: Free up runner space
        if: runner.environment == 'github-hosted'
        run: bash ./.github/scripts/cleanup.sh

      - name: Download build cache
        uses: actions/download-artifact@v4
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/

      - name: Import build cache
        run: bash ./.github/scripts/import-cache.sh

      - name: Package and sign
        env:
          HELIUM_KEYSTORE_B64: ${{ secrets.HELIUM_KEYSTORE_B64 }}
          HELIUM_KEYSTORE_PASSWORD: ${{ secrets.HELIUM_KEYSTORE_PASSWORD }}
          HELIUM_KEY_ALIAS: ${{ secrets.HELIUM_KEY_ALIAS }}
        run: ./scripts/package.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: helium-android-${{ inputs.arch }}
          path: |
            build/release/*.apk
            build/release/*.sha256
          if-no-files-found: error

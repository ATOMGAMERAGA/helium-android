name: Build Android release

on:
  workflow_dispatch:
    inputs:
      runner:
        required: false
        description: "Runner image/label to use"
        default: "ubuntu-latest"
      archs:
        required: false
        description: "Space-separated target archs (arm64 arm x64 x86)"
        default: "arm64 arm"
      do-release:
        required: false
        type: boolean
        description: "Create a release after build is done"
        default: false

permissions:
  contents: write

# NOTE: a full Chromium build takes 6-10+ hours and ~200 GB of disk on a
# standard github-hosted runner, which exceeds the free runner limits.
# Use a large self-hosted runner or a service like Depot (which sponsors
# upstream Helium's builders) for release builds.

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.archs.outputs.matrix }}
    steps:
      - id: archs
        run: |
          echo "matrix=$(echo '${{ inputs.archs }}' | tr -s ' ' '\n' | jq -cRn '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build Helium APK (${{ matrix.arch }})
    needs: setup
    runs-on: ${{ inputs.runner }}
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
              /usr/local/.ghcup /usr/share/swift || true
          df -h

      - name: Expose GitHub runtime for sccache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build
        env:
          CI: "1"
          ARCH: ${{ matrix.arch }}
        run: ./scripts/docker-build.sh

      - name: Package
        env:
          HELIUM_KEYSTORE_B64: ${{ secrets.HELIUM_KEYSTORE_B64 }}
          HELIUM_KEYSTORE_PASSWORD: ${{ secrets.HELIUM_KEYSTORE_PASSWORD }}
          HELIUM_KEY_ALIAS: ${{ secrets.HELIUM_KEY_ALIAS }}
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: helium-android-${{ matrix.arch }}
          path: |
            build/release/*.apk
            build/release/*.sha256
          if-no-files-found: error

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.do-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          echo "version=$(python3 helium-chromium/utils/helium_version.py \
              --tree helium-chromium --platform-tree . --print)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          files: |
            dist/*.apk
            dist/*.sha256

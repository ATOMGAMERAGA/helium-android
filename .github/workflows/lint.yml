name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get -y install shellcheck
          shellcheck -S warning scripts/*.sh .github/scripts/*.sh

  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate patch series
        run: |
          while read -r p; do
            [ -z "$p" ] && continue
            [[ "$p" == \#* ]] && continue
            if [ ! -f "patches/$p" ]; then
              echo "missing patch: $p" >&2
              exit 1
            fi
          done < patches/series

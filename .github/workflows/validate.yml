name: Validate

# fast checks that run on free runners: patch application against the
# real pinned Chromium sources, icon generation, resource mapping, and
# shell script health. Manually triggerable and run on every push/PR.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get -y install shellcheck
          shellcheck -x -P . -S warning scripts/*.sh .github/scripts/*.sh

  patches:
    name: Patches apply to pinned Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }

      - name: Check series file
        run: |
          while read -r p; do
            [ -z "$p" ] && continue
            [[ "$p" == \#* ]] && continue
            if [ ! -f "patches/$p" ]; then
              echo "missing patch: $p" >&2
              exit 1
            fi
          done < patches/series

      - name: Fetch patched files from the pinned Chromium tag
        run: |
          version="$(cat helium-chromium/chromium_version.txt)"
          echo "chromium $version"
          mkdir -p mocksrc

          # gitiles rate-limits rapid sequential requests, so a bare
          # 'curl -sf' loop fails intermittently on 429/5xx. Retry with
          # backoff and only give up on a definitive 404.
          fetch_file() {  # $1 = repo-relative path
            local f="$1" url attempt code
            url="https://chromium.googlesource.com/chromium/src/+/refs/tags/$version/$f?format=TEXT"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o "mocksrc/$f.b64" -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = 200 ]; then
                base64 -d < "mocksrc/$f.b64" > "mocksrc/$f"
                rm -f "mocksrc/$f.b64"
                return 0
              fi
              [ "$code" = 404 ] && break
              sleep $((attempt * attempt))
            done
            echo "failed to fetch $f (last HTTP $code)" >&2
            return 1
          }

          # every file touched by our patch series
          while read -r f; do
            mkdir -p "mocksrc/$(dirname "$f")"
            fetch_file "$f"
            echo "fetched $f"
          done < <(grep -h '^--- a/' patches/helium/android/*.patch \
                   | sed 's|^--- a/||' | sort -u)

      - name: Apply android patches
        run: python3 helium-chromium/utils/patches.py apply mocksrc patches

  resources:
    name: Icons and resource mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }

      - name: Install Pillow
        run: pip install pillow

      - name: Regenerate icons and compare dimensions
        run: |
          python3 devutils/generate_android_icons.py --output /tmp/icons
          python3 - <<'EOF'
          import pathlib, sys
          from PIL import Image

          committed = pathlib.Path('resources/android')
          fresh = pathlib.Path('/tmp/icons')
          errors = 0
          for new in sorted(fresh.rglob('*.png')):
              old = committed / new.relative_to(fresh)
              if not old.exists():
                  print(f'MISSING in repo: {old}'); errors += 1; continue
              a, b = Image.open(old), Image.open(new)
              if a.size != b.size:
                  print(f'SIZE MISMATCH {old}: {a.size} != {b.size}'); errors += 1
          sys.exit(1 if errors else 0)
          EOF

      - name: Check resource mapping list
        run: |
          while read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" == \#* ]] && continue
            src="${line%% *}"
            if [ ! -f "resources/$src" ]; then
              echo "missing resource: resources/$src" >&2
              exit 1
            fi
          done < resources/android_resources.txt

      - name: Verify mapped destinations exist in the pinned Chromium tag
        run: |
          version="$(cat helium-chromium/chromium_version.txt)"

          # gitiles rate-limits rapid sequential requests, so a bare
          # 'curl -sf' loop reports false "missing" failures on 429/5xx.
          # Retry with backoff; only a definitive 404 counts as missing,
          # and a persistently indeterminate response is a warning (so a
          # rate-limited run never fails the build spuriously).
          verify() {  # 0=exists, 1=missing(404), 2=indeterminate
            local url="$1" attempt code
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
              case "$code" in
                200) return 0 ;;
                404) return 1 ;;
                *) sleep $((attempt * attempt)) ;;
              esac
            done
            return 2
          }

          rc=0
          while read -r dst; do
            url="https://chromium.googlesource.com/chromium/src/+/refs/tags/$version/$dst?format=TEXT"
            r=0
            verify "$url" || r=$?
            case "$r" in
              0) ;;
              1) echo "destination missing in chromium $version: $dst" >&2; rc=1 ;;
              *) echo "warning: could not verify (transient) $dst" >&2 ;;
            esac
          done < <(awk '!/^#/ && NF == 2 { print $2 }' resources/android_resources.txt)
          exit $rc

  gn-flags:
    name: GN flags are well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }

      - name: Syntax-check combined GN args
        run: |
          cat helium-chromium/flags.gn flags.android.gn | while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" == \#* ]] && continue
            if ! [[ "$line" =~ ^[a-z0-9_]+[[:space:]]*=[[:space:]]*.+$ ]]; then
              echo "malformed GN line: $line" >&2
              exit 1
            fi
          done
          # no duplicate assignments between shared and android flags
          dupes=$(cat helium-chromium/flags.gn flags.android.gn \
            | grep -v '^#' | grep -oE '^[a-z0-9_]+' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "duplicate GN args: $dupes" >&2
            exit 1
          fi
